name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build APK
        run: |
          yes | buildozer init || true
          sed -i 's/#*android.accept_sdk_license_agreements.*/android.accept_sdk_license_agreements = True/' buildozer.spec
          grep -q "accept_sdk_license" buildozer.spec || echo "android.accept_sdk_license_agreements = True" >> buildozer.spec
          yes | buildozer -v android debug || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea731d8" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          yes | buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-APK
          path: bin/*.apk
